version: '3.8'

services:
  bharatosint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bharatosint_app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/bharatosint.db:/app/backend/bharatosint.db
    restart: unless-stopped
